      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: payment
    depends_on:
      paymentdb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "payment-service"
      SPRING_DATASOURCE_URL: jdbc:mysql://paymentdb:3306/paymenttb_NN
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - racine




  prevention:
    image: "racinekane/ndankndank-prevention:v2"
    ports:
      - "5007:5007"
    healthcheck:
      test: "curl --fail --silent  prevention:5007/actuator/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: prevention
    depends_on:
      preventiondb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "prevention-service"
      SPRING_DATASOURCE_URL: jdbc:mysql://preventiondb:3306/preventiondb_NN
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
