      - "5002:5002"
    healthcheck:
      test: "curl --fail --silent  financing-company:5002/actuator/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: financing-company
    depends_on:
      companydb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "financing-company-service"
      SPRING_DATASOURCE_URL: jdbc:mysql://companydb:3306/companydb_NN
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
