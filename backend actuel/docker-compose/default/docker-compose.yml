services:

  userdb:
    image: mysql
    ports:
      - "3301:3306"
    container_name: userdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb_NN
    networks:
      - racine


  categorydb:
    image: mysql
    ports:
      - "3302:3306"
    container_name: categorydb
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: categorydb_NN
    networks:
      - racine


  opportunitydb:
    image: mysql
    ports:
      - "3303:3306"
    container_name: opportunitydb
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financingoppdb_NN
    networks:
      - racine


  companydb:
    image: mysql
    ports:
      - "3304:3306"
    container_name: companydb
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: companydb_NN
    networks:
      - racine



  bookingdb:
    image: mysql
    ports:
      - "3305:3306"
    container_name: bookingdb
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: interviewbookingdb_NN
    networks:
      - racine




  paymentdb:
    image: mysql
    ports:
      - "3307:3306"
    container_name: paymentdb
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paymenttb_NN
    networks:
      - racine


  preventiondb:
    image: mysql
    ports:
      - "3308:3306"
    container_name: preventiondb
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: preventiondb_NN
    networks:
      - racine



  eurekaserver:
    image: "racinekane/ndankndank-eurekaserver:v2"
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent  eurekaserver:8070/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: eurekaserver
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - racine



  user:
    image: "racinekane/ndankndank-user:v2"
    ports:
      - "5001:5001"
    healthcheck:
      test: "curl --fail --silent  user:5001/actuator/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    container_name: user
    depends_on:
      userdb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_DATASOURCE_URL: jdbc:mysql://userdb:3306/userdb_NN
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENT_ID: ndankndank-client
      KEYCLOAK_CLIENT_SECRET: 7NAiHfwDZq61jBsYLzCToLcOFulv29VF
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - racine



  category:
    image: "racinekane/ndankndank-category:v2"
    ports:
      - "5003:5003"
    healthcheck:
      test: "curl --fail --silent  category:5003/actuator/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: category
    depends_on:
      categorydb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "category-service"
      SPRING_DATASOURCE_URL: jdbc:mysql://categorydb:3306/categorydb_NN
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - racine


  financing-opportunity:
