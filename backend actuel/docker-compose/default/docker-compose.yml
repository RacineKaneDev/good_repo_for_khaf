  gatewayserver:
    image: "racinekane/ndankndank-gatewayserver:v2"
    ports:
      - "5000:5000"
    healthcheck:
      test: "curl --fail --silent  gatewayserver:5000/actuator/health || exist 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: gatewayserver
    depends_on:
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - racine





  postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - racine
    deploy:
      resources:
        limits:
          memory: 700m
    restart: always

  keycloak:
      image: quay.io/keycloak/keycloak:26.0.0
      container_name: keycloak
      command: start-dev
      environment:
        - KC_DB=postgres
        - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
        - KC_DB_USERNAME=keycloak
        - KC_DB_PASSWORD=keycloak
        - KC_BOOTSTRAP_ADMIN_USERNAME=admin
        - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      ports:
        - "8080:8080"
      depends_on:
        - postgres
      volumes:
        - keycloak_data:/opt/keycloak/data
      networks:
        - racine
      deploy:
        resources:
          limits:
            memory: 700m
      restart: always



  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - racine
    deploy:
      resources:
        limits:
          memory: 700m

  grafana:
      image: grafana/grafana:latest
      ports:
        - "3000:3000"
      depends_on:
        - prometheus
      networks:
        - racine
      deploy:
        resources:
          limits:
            memory: 700m


volumes:
    postgres_data:
    keycloak_data:




networks:
  racine:
    external: true
