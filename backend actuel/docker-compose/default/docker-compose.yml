  interview-booking:
    image: "racinekane/ndankndank-booking:v2"
    ports:
      - "5005:5005"
    healthcheck:
      test: "curl --fail --silent  interview-booking:5005/actuator/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: interview-booking
    depends_on:
      bookingdb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "interview-booking"
      SPRING_DATASOURCE_URL: jdbc:mysql://bookingdb:3306/interviewbookingdb_NN
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
