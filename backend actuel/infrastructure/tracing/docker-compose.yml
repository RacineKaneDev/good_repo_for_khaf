version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.41
    container_name: jaeger
    ports:
      - "16686:16686" # UI
      - "14250:14250" # gRPC
    networks:
      - racine
    deploy:
      resources:
        limits:
          memory: 700m

networks:
  racine:
    external: true